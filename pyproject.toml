[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workflowy-importer"
version = "0.2.0"
description = "Import Markdown trees into Workflowy through the official API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<5",
]

[project.scripts]
workflowy-import-md = "workflowy_importer.cli:main"
workflowy-import-smoke = "workflowy_importer.smoke:main"
wf = "workflowy_importer.bridge_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
